name: ci

on:
  push:
    branches: [main]
  pull_request:

# scopeward flags workflows whose GITHUB_TOKEN defaults to write
# (nonhuman.default-workflow-token). Read-only here; no job widens it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag: a floating tag is
      # exactly what supplychain.unpinned-action reports, and this repository
      # should pass its own audit.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: make fmt

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      # We ship a single cross-platform binary, so a platform break must fail
      # here and not at tag time, inside the release. Compile only — these
      # targets cannot be executed on the runner.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/scopeward
          done
