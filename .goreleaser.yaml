version: 2

project_name: scopeward

before:
  hooks:
    - go mod tidy

builds:
  - id: scopeward
    main: ./cmd/scopeward
    binary: scopeward
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/sunnysystems/scopeward/internal/cli.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: scopeward
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
